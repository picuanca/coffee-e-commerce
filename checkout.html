<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />

    <title>Checkout - Coffee Store</title>
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="index.html">
            Coffee Store
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="products.html">Shop</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">About</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">Contact</a>
              </li>

              <li class="nav-item">
                <a class="nav-link active" href="checkout.html">Cart</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main -->
    <main>
      <section class="container py-5">
        <h1 class="text-center mb-5">Checkout</h1>

        <div class="row g-5">

          <!-- Customer information -->
          <div class="col-12 col-lg-7">

            <h3 class="mb-4">Shipping Information</h3>

            <form>
              <div class="row g-3">

                <div class="col-md-6">
                  <label for="firstName" class="form-label">
                    First Name
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                  />
                </div>

                <div class="col-md-6">
                  <label for="lastName" class="form-label">
                    Last Name
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="lastName"
                  />
                </div>

                <div class="col-12">
                  <label for="email" class="form-label">
                    Email
                  </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                  />
                </div>

                <div class="col-12">
                  <label for="address" class="form-label">
                    Address
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="address"
                  />
                </div>

                <div class="col-md-6">
                  <label for="city" class="form-label">
                    City
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="city"
                  />
                </div>

                <div class="col-md-6">
                  <label for="zip" class="form-label">
                    ZIP Code
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="zip"
                  />
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="saveInfo"
                    />

                    <label
                      class="form-check-label"
                      for="saveInfo"
                    >
                      Save contact information
                    </label>
                  </div>
                </div>

              </div>
            </form>

            <!-- Payment -->
            <h3 class="mt-5 mb-4">Payment Information</h3>

            <form>
              <div class="mb-3">
                <label for="cardName" class="form-label">
                  Cardholder Name
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="cardName"
                />
              </div>

              <div class="mb-3">
                <label for="cardNumber" class="form-label">
                  Card Number
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="cardNumber"
                />
              </div>

              <div class="row">
                <div class="col-md-6">
                  <label for="expiration" class="form-label">
                    Expiration Date
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="expiration"
                    placeholder="MM/YY"
                  />
                </div>

                <div class="col-md-6">
                  <label for="cvc" class="form-label">
                    CVC
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="cvc"
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-dark w-100 mt-4"
              >
                Pay Now
              </button>
            </form>

          </div>

          <!-- Order summary -->
          <div class="col-12 col-lg-5">

            <div class="card p-4">

              <h3 class="mb-4">Your Cart</h3>

              <div class="d-flex justify-content-between mb-3">
                <div>
                  <strong>Coffee Brazil</strong>
                  <br />
                  <small>Quantity: 1</small>
                </div>

                <span>150 RON</span>
              </div>

              <div class="d-flex justify-content-between mb-3">
                <div>
                  <strong>Coffee Ethiopia</strong>
                  <br />
                  <small>Quantity: 1</small>
                </div>

                <span>190 RON</span>
              </div>

              <div class="d-flex justify-content-between mb-3">
                <div>
                  <strong>Coffee Guatemala</strong>
                  <br />
                  <small>Quantity: 1</small>
                </div>

                <span>220 RON</span>
              </div>

              <hr />

              <div class="d-flex justify-content-between">
                <strong>Total</strong>
                <strong>560 RON</strong>
              </div>

            </div>

          </div>

        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
      <div class="container text-center">
        <p class="mb-0">
          &copy; 2026 Coffee Store
        </p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
